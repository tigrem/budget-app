services:
  redis:
    image: redis:7-alpine
    container_name: budget-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: ghcr.io/yasterlij/budget-app:test
    container_name: budget-app
    restart: unless-stopped
    user: "root"
    expose:
      - "3003"
    command: npm start
    env_file:
      - /data-disk/applications/budget-app/.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=${NODE_ENV}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED}
      - COOKIES_SECURE=${COOKIES_SECURE}
      - NEXTAUTH_COOKIE_SECURE=${NEXTAUTH_COOKIE_SECURE}
      - NEXTAUTH_USE_SECURE_COOKIES=${NEXTAUTH_USE_SECURE_COOKIES}
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
      - ./docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh

  nginx-proxy:
    image: nginx:alpine
    container_name: budget-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  redis-data:
    name: budget_redis_data
  uploads-data:
    name: budget_uploads_data
