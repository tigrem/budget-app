services:
  redis:
    image: redis:7-alpine
    container_name: budget-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - budget-net

  app:
    image: ghcr.io/yasterlij/budget-app:v3.3.6
    container_name: budget-app
    restart: unless-stopped
    user: "root"
    expose:
      - "3003"
    command: npm start
    env_file:
      - /data-disk/applications/budget-app/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
      - ./docker-entrypoint.sh:/app/scripts/docker-entrypoint.sh
    extra_hosts:
      - "deploy.ethiotelecom.et:196.189.51.118"
    networks:
      - budget-net

  worker:
    image: ghcr.io/yasterlij/budget-app:v3.3.6
    container_name: budget-upload-workers
    restart: unless-stopped
    user: "root"
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/workers/index.ts"]
    env_file:
      - /data-disk/applications/budget-app/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - WORKER_PROCESS=true
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    extra_hosts:
      - "deploy.ethiotelecom.et:196.189.51.118"
    networks:
      - budget-net

  nginx-proxy:
    image: nginx:alpine
    container_name: budget-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - budget-net

volumes:
  redis-data:
    name: budget_redis_data
  uploads-data:
    name: budget_uploads_datta

networks:
  budget-net:
    driver: bridge
